<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mac Deck">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.json">
  <title>Mac Deck</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #000;
      --card:      #1c1c1e;
      --card2:     #2c2c2e;
      --fill:      #3a3a3c;
      --border:    rgba(255,255,255,0.08);
      --text:      #fff;
      --text2:     rgba(255,255,255,0.5);
      --text3:     rgba(255,255,255,0.28);
      --accent:    #0a84ff;
      --green:     #30d158;
      --red:       #ff453a;
      --tab-h:     0px;
      --safe-top:  env(safe-area-inset-top, 0px);
      --safe-bot:  env(safe-area-inset-bottom, 0px);
      --r:         16px;          /* card radius */
    }

    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    body { display: flex; flex-direction: column; padding-top: var(--safe-top); }
    ::-webkit-scrollbar { display: none; }

    /* ── SVG icon helper ──────────────────────────────────────────────────── */
    .ico {
      display: block; flex-shrink: 0;
      fill: none; stroke: currentColor;
      stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
      pointer-events: none;
    }
    .ico-fill { fill: currentColor; stroke: none; }

    /* ── Status bar ───────────────────────────────────────────────────────── */
    #status {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px 4px; flex-shrink: 0;
    }
    #conn-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 500; color: var(--text2);
      letter-spacing: 0.01em;
    }
    #conn-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--fill); transition: background 0.4s, box-shadow 0.4s;
    }
    #conn-dot.live  { background: var(--green); box-shadow: 0 0 7px var(--green); }
    #conn-dot.error { background: var(--red); }
    #fs-btn {
      background: none; border: none; color: var(--text3);
      cursor: pointer; padding: 4px; border-radius: 8px; display: flex;
      transition: color 0.2s;
    }
    #fs-btn:active { color: var(--accent); }

    /* ── Pages ────────────────────────────────────────────────────────────── */
    .page {
      flex: 1; overflow-y: auto;
      padding: 8px 16px calc(var(--safe-bot) + 24px);
    }

    /* ── Card ─────────────────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: var(--r);
      margin-bottom: 10px;
      overflow: hidden;
    }

    /* ── Now Playing ──────────────────────────────────────────────────────── */
    #now-playing {
      padding: 16px 18px 18px;
      display: flex; flex-direction: column; gap: 14px;
    }
    #np-meta { display: flex; align-items: center; gap: 12px; }
    #np-icon-wrap {
      width: 42px; height: 42px; border-radius: 10px;
      background: var(--card2);
      display: flex; align-items: center; justify-content: center;
      color: var(--text3); flex-shrink: 0;
    }
    #np-text { flex: 1; min-width: 0; }
    #np-title  { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #np-artist { font-size: 13px; color: var(--text2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #np-idle   { font-size: 15px; color: var(--text2); }

    /* Media transport */
    #media-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 8px;
    }
    .transport-btn {
      background: none; border: none; color: var(--text);
      cursor: pointer; padding: 8px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.12s, transform 0.1s;
    }
    .transport-btn:active { opacity: 0.5; transform: scale(0.88); }
    #play-pause-btn {
      background: var(--text); color: var(--bg);
      width: 64px; height: 64px; border-radius: 50%;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.12s, transform 0.1s;
      flex-shrink: 0;
    }
    #play-pause-btn:active { opacity: 0.8; transform: scale(0.91); }

    /* ── Slider rows (volume, brightness) ─────────────────────────────────── */
    .slider-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px;
    }
    .slider-icon { color: var(--text2); display: flex; align-items: center; flex-shrink: 0; }
    .slider-wrap { flex: 1; display: flex; align-items: center; gap: 10px; }
    .step-btn {
      background: var(--card2); border: none; color: var(--text);
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: opacity 0.12s, transform 0.1s;
    }
    .step-btn:active { opacity: 0.6; transform: scale(0.88); }

    input[type=range] {
      -webkit-appearance: none; appearance: none; flex: 1;
      height: 4px; border-radius: 2px; outline: none; cursor: pointer;
      background: var(--fill);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px; height: 24px; border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.45);
    }
    .slider-val { font-size: 13px; font-weight: 500; color: var(--text2); min-width: 34px; text-align: right; }

    /* Divider between rows within a card */
    .card-divider { height: 1px; background: var(--border); margin: 0 18px; }

    /* ── Screen dimmer overlay ────────────────────────────────────────────── */
    #dim-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: #000;
      opacity: 0;
      pointer-events: none; /* taps pass straight through */
      transition: opacity 0.2s;
    }

    /* ── System action grid ────────────────────────────────────────────────── */
    #sys-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 10px;
    }
    .sys-btn {
      background: var(--card); border: none; color: var(--text);
      border-radius: var(--r); padding: 18px 8px 14px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer;
      transition: opacity 0.12s, transform 0.1s;
      user-select: none;
    }
    .sys-btn:active { opacity: 0.6; transform: scale(0.91); }
    .sys-btn-label { font-size: 11px; color: var(--text2); font-weight: 500; letter-spacing: 0.01em; }
    .sys-btn.destructive { color: var(--red); }
    .sys-btn.destructive .sys-btn-label { color: var(--red); opacity: 0.7; }

    /* ── Running Apps section ────────────────────────────────────────────── */
    #apps-header {
      font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--text2);
      padding: 6px 4px 10px;
    }
    #apps-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .app-cell {
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
      transition: opacity 0.12s, transform 0.1s;
    }
    .app-cell:active { opacity: 0.65; transform: scale(0.91); }
    .app-cell.switching .app-cell-icon { outline: 2.5px solid var(--accent); }

    .app-cell-icon {
      width: 72px; height: 72px; border-radius: 18px;
      overflow: hidden; background: var(--card2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .app-cell-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .app-cell-icon .app-initial {
      font-size: 28px; font-weight: 600; color: var(--text2);
    }
    .app-cell-name {
      font-size: 11px; color: var(--text2); text-align: center;
      line-height: 1.3; max-width: 80px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }

    #apps-empty  { text-align: center; color: var(--text3); font-size: 14px; padding: 60px 0; display: none; }
    #apps-loading { text-align: center; color: var(--text3); font-size: 14px; padding: 60px 0; }

    /* ── Pinned Dock ─────────────────────────────────────────────────────────── */
    #dock-header {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--text2);
      padding: 18px 4px 10px;
    }
    #dock-edit-btn {
      background: none; border: none; color: var(--accent);
      font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 0;
    }
    #dock-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 14px; margin-bottom: 24px;
    }
    /* add-cell — the + button */
    .dock-add-cell {
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
      transition: opacity 0.12s, transform 0.1s;
    }
    .dock-add-cell:active { opacity: 0.6; transform: scale(0.91); }
    .dock-add-icon {
      width: 72px; height: 72px; border-radius: 18px;
      background: var(--card2);
      border: 2px dashed rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      color: var(--text3);
    }
    .dock-add-label {
      font-size: 11px; color: var(--text3); text-align: center;
    }
    /* remove badge on dock cells in edit mode */
    .dock-cell { position: relative; }
    .dock-remove-badge {
      display: none; position: absolute; top: -4px; left: -4px;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--red); color: #fff;
      font-size: 14px; font-weight: 700; line-height: 20px; text-align: center;
      z-index: 10; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    #dock-grid.editing .dock-remove-badge { display: block; }
    #dock-grid.editing .app-cell { animation: wiggle 0.5s ease-in-out infinite alternate; }
    @keyframes wiggle {
      from { transform: rotate(-1.2deg); }
      to   { transform: rotate(1.2deg); }
    }

    /* ── App picker sheet ───────────────────────────────────────────────────── */
    #picker-sheet {
      display: none; position: fixed; inset: 0; z-index: 100;
    }
    #picker-sheet.show { display: flex; flex-direction: column; justify-content: flex-end; }
    #picker-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    }
    #picker-panel {
      position: relative; background: #1c1c1e;
      border-radius: 20px 20px 0 0;
      max-height: 72vh; display: flex; flex-direction: column;
      padding-bottom: var(--safe-bot);
      transition: transform 0.2s ease;
    }
    #picker-handle-wrap { padding: 14px 0 4px; display: flex; justify-content: center; }
    .picker-handle { width: 36px; height: 4px; background: var(--fill); border-radius: 2px; }
    #picker-title {
      font-size: 15px; font-weight: 600; text-align: center;
      padding: 0 20px 12px; color: var(--text);
      flex-shrink: 0;
    }
    #picker-search-wrap {
      padding: 4px 16px 10px;
      flex-shrink: 0;
    }
    #picker-search {
      width: 100%; background: var(--card2); border: none; border-radius: 10px;
      color: var(--text); font-size: 15px; padding: 10px 14px;
      outline: none;
    }
    #picker-search::placeholder { color: var(--text3); }
    #picker-list {
      overflow-y: auto; padding: 0 0 16px;
    }
    .picker-item {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 20px; cursor: pointer; transition: background 0.1s;
    }
    .picker-item:active { background: rgba(255,255,255,0.06); }
    .picker-item-icon {
      width: 44px; height: 44px; border-radius: 11px;
      background: var(--card2); flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .picker-item-icon img { width: 100%; height: 100%; object-fit: cover; }
    .picker-item-icon .app-initial { font-size: 20px; font-weight: 600; color: var(--text2); }
    .picker-item-name { font-size: 16px; font-weight: 500; }
    .picker-item.already-pinned { opacity: 0.35; pointer-events: none; }


    /* ── Install banner ───────────────────────────────────────────────────── */
    #install-banner {
      background: var(--card); border-radius: var(--r);
      padding: 14px 16px; margin-bottom: 10px;
      display: none; align-items: center; gap: 12px;
    }
    #install-banner.show { display: flex; }
    #install-banner-text { flex: 1; font-size: 14px; color: var(--text2); }
    #install-banner-text strong { color: var(--text); font-weight: 600; }
    #install-btn {
      background: var(--accent); border: none; color: #fff;
      font-size: 13px; font-weight: 600; padding: 8px 14px;
      border-radius: 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    #install-dismiss {
      background: none; border: none; color: var(--text3);
      cursor: pointer; display: flex; padding: 2px; flex-shrink: 0;
    }

    /* ── WoL bottom sheet ─────────────────────────────────────────────────── */
    #wol-sheet {
      display: none; position: fixed; inset: 0; z-index: 100;
    }
    #wol-sheet.show { display: flex; flex-direction: column; justify-content: flex-end; }
    #wol-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    }
    #wol-panel {
      position: relative; background: #1c1c1e;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px calc(20px + var(--safe-bot));
    }
    .wol-handle {
      width: 36px; height: 4px; background: var(--fill);
      border-radius: 2px; margin: 0 auto 20px;
    }
    #wol-panel h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    #wol-panel p  { font-size: 14px; color: var(--text2); line-height: 1.5; margin-bottom: 18px; }
    #wol-cmd {
      background: #000; border-radius: 10px;
      padding: 12px 14px; font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px; color: #5ac8fa; margin-bottom: 16px;
      word-break: break-all; letter-spacing: 0.02em;
    }
    .wol-actions { display: flex; gap: 10px; }
    .wol-action {
      flex: 1; border: none; border-radius: 12px; font-size: 14px;
      font-weight: 600; padding: 14px 8px; cursor: pointer;
      transition: opacity 0.15s;
    }
    .wol-action:active { opacity: 0.75; }
    .wol-action.primary { background: var(--accent); color: #fff; }
    .wol-action.secondary { background: var(--card2); color: var(--text); }
    #wol-copied {
      text-align: center; font-size: 12px; color: var(--green);
      margin-top: 12px; opacity: 0; transition: opacity 0.3s;
    }
    #wol-copied.show { opacity: 1; }

    /* ── Toast ────────────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: calc(var(--safe-bot) + 20px);
      left: 50%; transform: translateX(-50%);
      background: rgba(44,44,46,0.96); color: var(--text);
      font-size: 13px; font-weight: 500;
      padding: 10px 18px; border-radius: 20px;
      white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity 0.2s; z-index: 200;
      backdrop-filter: blur(12px);
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- ── Status bar ─────────────────────────────────────────────────────────────── -->
<div id="status">
  <div id="conn-badge">
    <span id="conn-dot"></span>
    <span id="conn-label">Connecting</span>
  </div>
  <button id="fs-btn" aria-label="Fullscreen">
    <svg class="ico" width="20" height="20"><use href="#i-maximize"/></svg>
  </button>
</div>

<!-- ══════════════════════ CONTROLS PAGE ══════════════════════ -->
<div class="page active" id="pg-controls">

  <!-- PWA install -->
  <div id="install-banner">
    <div id="install-banner-text"><strong>Add to Home Screen</strong> for fullscreen</div>
    <button id="install-btn">Install</button>
    <button id="install-dismiss" aria-label="Dismiss">
      <svg class="ico" width="18" height="18"><use href="#i-x"/></svg>
    </button>
  </div>

  <!-- Now Playing + Transport -->
  <div class="card" id="now-playing">
    <div id="np-meta">
      <div id="np-icon-wrap">
        <svg class="ico" width="22" height="22"><use href="#i-music"/></svg>
      </div>
      <div id="np-text">
        <div id="np-idle">Nothing Playing</div>
        <div id="np-title"  style="display:none"></div>
        <div id="np-artist" style="display:none"></div>
      </div>
    </div>
    <div id="media-row">
      <button class="transport-btn" data-action="prevTrack" aria-label="Previous">
        <svg class="ico" width="28" height="28"><use href="#i-skip-back"/></svg>
      </button>
      <button id="play-pause-btn" data-action="playPause" aria-label="Play / Pause">
        <svg class="ico" id="play-ico" width="26" height="26"><use href="#i-play"/></svg>
      </button>
      <button class="transport-btn" data-action="nextTrack" aria-label="Next">
        <svg class="ico" width="28" height="28"><use href="#i-skip-forward"/></svg>
      </button>
    </div>
  </div>

  <!-- Volume -->
  <div class="card">
    <div class="slider-row">
      <button id="mute-btn" data-action="toggleMute" class="slider-icon" style="background:none;border:none;cursor:pointer;padding:0;" aria-label="Mute">
        <svg class="ico" width="22" height="22" id="vol-ico"><use href="#i-vol-high"/></svg>
      </button>
      <div class="slider-wrap">
        <button class="step-btn" data-action="volumeDown" aria-label="Volume down">
          <svg class="ico" width="14" height="14"><use href="#i-minus"/></svg>
        </button>
        <input type="range" id="vol-slider" min="0" max="100" value="50" aria-label="Volume">
        <button class="step-btn" data-action="volumeUp" aria-label="Volume up">
          <svg class="ico" width="14" height="14"><use href="#i-plus"/></svg>
        </button>
      </div>
      <span class="slider-val" id="vol-val">50%</span>
    </div>
  </div>


  <!-- Screen dimmer -->
  <div class="card">
    <div class="slider-row">
      <div class="slider-icon">
        <svg class="ico" width="22" height="22"><use href="#i-moon"/></svg>
      </div>
      <div class="slider-wrap">
        <button class="step-btn" id="dim-down" aria-label="Less dim">
          <svg class="ico" width="14" height="14"><use href="#i-minus"/></svg>
        </button>
        <input type="range" id="dim-slider" min="0" max="90" value="0" aria-label="Screen dim">
        <button class="step-btn" id="dim-up" aria-label="More dim">
          <svg class="ico" width="14" height="14"><use href="#i-plus"/></svg>
        </button>
      </div>
      <span class="slider-val" id="dim-val">Off</span>
    </div>
  </div>

  <!-- System actions -->
  <div id="sys-grid">
    <button class="sys-btn" data-action="wakeDisplay">
      <svg class="ico" width="26" height="26"><use href="#i-monitor"/></svg>
      <span class="sys-btn-label">Wake</span>
    </button>
    <button class="sys-btn" data-action="lock">
      <svg class="ico" width="26" height="26"><use href="#i-lock"/></svg>
      <span class="sys-btn-label">Lock</span>
    </button>
    <button class="sys-btn" data-action="missionControl">
      <svg class="ico" width="26" height="26"><use href="#i-layout"/></svg>
      <span class="sys-btn-label">Mission</span>
    </button>
    <button class="sys-btn" data-action="screenshot">
      <svg class="ico" width="26" height="26"><use href="#i-camera"/></svg>
      <span class="sys-btn-label">Screenshot</span>
    </button>
    <button class="sys-btn" id="wol-btn">
      <svg class="ico" width="26" height="26"><use href="#i-zap"/></svg>
      <span class="sys-btn-label">Wake on LAN</span>
    </button>
    <button class="sys-btn destructive" data-action="sleep">
      <svg class="ico" width="26" height="26"><use href="#i-moon"/></svg>
      <span class="sys-btn-label">Sleep</span>
    </button>
  </div>

  <!-- Open Apps (inline) -->
  <div id="apps-header">Open Apps</div>
  <div id="apps-loading">Loading…</div>
  <div id="apps-empty">No apps open</div>
  <div id="apps-grid"></div>

  <!-- Pinned Dock -->
  <div id="dock-header">
    <span>My Dock</span>
    <button id="dock-edit-btn">Edit</button>
  </div>
  <div id="dock-grid"></div>

</div><!-- /pg-controls -->

<!-- ── App picker sheet ────────────────────────────────────────────────────── -->
<div id="picker-sheet">
  <div id="picker-backdrop"></div>
  <div id="picker-panel">
    <div id="picker-handle-wrap"><div class="picker-handle"></div></div>
    <div id="picker-title">Add to Dock</div>
    <div id="picker-search-wrap">
      <input id="picker-search" type="search" placeholder="Search apps…" autocomplete="off">
    </div>
    <div id="picker-list"></div>
  </div>
</div>

<!-- ── Screen dim overlay (pointer-events:none so taps pass through) ─────── -->
<div id="dim-overlay"></div>

<!-- ── WoL sheet ──────────────────────────────────────────────────────────── -->
<div id="wol-sheet">
  <div id="wol-backdrop"></div>
  <div id="wol-panel">
    <div class="wol-handle"></div>
    <h3>Wake on LAN</h3>
    <p>Mac is asleep — run this in Termux to send the magic packet.</p>
    <div id="wol-cmd"></div>
    <div class="wol-actions">
      <button class="wol-action primary" id="wol-copy-btn">Copy Command</button>
      <button class="wol-action secondary" id="wol-termux-btn">Open Termux</button>
    </div>
    <div id="wol-copied">Copied to clipboard</div>
  </div>
</div>

<!-- ── Toast ──────────────────────────────────────────────────────────────── -->
<div id="toast" role="status"></div>

<script>
/* ── Constants ────────────────────────────────────────────────────────────── */
const WS_URL = `ws://${location.hostname}:${location.port || 3333}`;
let knownVersion = null;

/* ── State ────────────────────────────────────────────────────────────────── */
let ws = null, reconnectDelay = 1000;
let volume = 50, muted = false, brightness = null;
let sliderActive = false;
let runningApps = [];
let wolMac = localStorage.getItem('mac-deck-mac') || '10:b5:88:64:cf:e3';

/* ── DOM ──────────────────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const $connDot   = $('conn-dot');
const $connLabel = $('conn-label');
const $npIdle    = $('np-idle');
const $npTitle   = $('np-title');
const $npArtist  = $('np-artist');
const $volSlider = $('vol-slider');
const $volVal    = $('vol-val');
const $appsGrid  = $('apps-grid');
const $appsEmpty = $('apps-empty');
const $appsLoad  = $('apps-loading');

/* ── Screen wake lock (prevent phone screen from sleeping) ────────────────── */
let wakeLock = null;
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') acquireWakeLock();
});
acquireWakeLock();

/* ── WebSocket ────────────────────────────────────────────────────────────── */
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    $connDot.className = 'live';
    $connLabel.textContent = 'Connected';
    reconnectDelay = 1000;
  };
  ws.onclose = ws.onerror = () => {
    $connDot.className = 'error';
    $connLabel.textContent = 'Reconnecting…';
    setTimeout(() => { reconnectDelay = Math.min(reconnectDelay * 1.5, 12000); connect(); }, reconnectDelay);
  };
  ws.onmessage = ({ data }) => {
    const msg = JSON.parse(data);
    if (msg.type === 'version')     checkVersion(msg.version);
    if (msg.type === 'state')       applyState(msg);
    if (msg.type === 'runningApps') applyRunningApps(msg.apps);
  };
}

function send(action, payload = {}) {
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action, payload }));
  vibrate(22);
}

/* ── Auto-reload on server restart ───────────────────────────────────────── */
function checkVersion(v) {
  if (!knownVersion) { knownVersion = v; return; }
  if (knownVersion !== v) { showToast('Updated — reloading…'); setTimeout(() => location.reload(), 1200); }
}

/* ── State ────────────────────────────────────────────────────────────────── */
function applyState(s) {
  if (s.volume !== undefined) {
    volume = s.volume;
    if (!sliderActive) { $volSlider.value = volume; paintSlider($volSlider, volume); }
    $volVal.textContent = `${volume}%`;
  }
  if (s.muted !== undefined) {
    muted = s.muted;
    const use = $('vol-ico').querySelector('use');
    use.setAttribute('href', muted ? '#i-vol-off' : volume < 40 ? '#i-vol-low' : '#i-vol-high');
    $('mute-btn').style.color = muted ? 'var(--text3)' : '';
  }
  if (s.nowPlaying !== undefined) {
    const np = s.nowPlaying;
    if (np?.title) {
      $npIdle.style.display   = 'none';
      $npTitle.style.display  = 'block';
      $npArtist.style.display = 'block';
      $npTitle.textContent    = np.title;
      $npArtist.textContent   = np.artist || '';
      // isPlaying=true → currently playing → show ⏸  (tap to pause)
      // isPlaying=false → paused → show ▶  (tap to resume)
      $('play-ico').querySelector('use').setAttribute('href', np.isPlaying ? '#i-pause' : '#i-play');
    } else {
      $npIdle.style.display   = 'block';
      $npTitle.style.display  = 'none';
      $npArtist.style.display = 'none';
      $('play-ico').querySelector('use').setAttribute('href', '#i-play');
    }
  }
}

/* ── Running apps ─────────────────────────────────────────────────────────── */
function applyRunningApps(apps) {
  runningApps = apps || [];
  renderApps();
}

function renderApps() {
  $appsLoad.style.display = 'none';
  if (!runningApps.length) {
    $appsEmpty.style.display = 'block';
    $appsGrid.innerHTML = '';
    return;
  }
  $appsEmpty.style.display = 'none';

  const currentNames = [...$appsGrid.querySelectorAll('.app-cell')].map(c => c.dataset.name);
  const newNames = runningApps.map(a => a.name);
  if (JSON.stringify(currentNames) === JSON.stringify(newNames)) return;

  $appsGrid.innerHTML = '';
  runningApps.forEach(app => {
    const { name, appPath, appName, iconName, chromeWindowIndex } = app;
    const cell = document.createElement('div');
    cell.className = 'app-cell';
    cell.dataset.name = name;

    const iconWrap = document.createElement('div');
    iconWrap.className = 'app-cell-icon';

    const img = document.createElement('img');
    img.alt = name;
    // Chrome windows carry iconName='Google Chrome' so they all share the same icon
    img.src = `/api/icon/${encodeURIComponent(iconName || name)}`;
    img.onerror = () => {
      img.remove();
      const init = document.createElement('span');
      init.className = 'app-initial';
      init.textContent = name[0];
      iconWrap.appendChild(init);
    };
    iconWrap.appendChild(img);

    const label = document.createElement('div');
    label.className = 'app-cell-name';
    label.textContent = name;

    cell.appendChild(iconWrap);
    cell.appendChild(label);
    cell.addEventListener('click', () => {
      cell.classList.add('switching');
      // For Chrome windows pass the window index so the right window is raised
      const payload = chromeWindowIndex
        ? { appName: appName || name, appPath, chromeWindowIndex }
        : { appName: appName || name, appPath };
      send('switchApp', payload);
      setTimeout(() => cell.classList.remove('switching'), 500);
    });
    $appsGrid.appendChild(cell);
  });
}


fetch('/config.json').then(r => r.json()).then(cfg => {
  if (cfg.macAddress) { wolMac = cfg.macAddress; localStorage.setItem('mac-deck-mac', cfg.macAddress); }
  if (cfg.version && !knownVersion) knownVersion = cfg.version;
}).catch(() => {});

/* ── Sliders ──────────────────────────────────────────────────────────────── */
function paintSlider(el, val, color = 'var(--accent)') {
  const pct = `${val}%`;
  el.style.background = `linear-gradient(to right, ${color} ${pct}, var(--fill) ${pct})`;
}
$volSlider.addEventListener('input', () => {
  sliderActive = true;
  paintSlider($volSlider, $volSlider.value);
  $volVal.textContent = `${$volSlider.value}%`;
});
$volSlider.addEventListener('change', () => {
  sliderActive = false;
  send('setVolume', { level: +$volSlider.value });
});
paintSlider($volSlider, 50);

/* ── Button actions ───────────────────────────────────────────────────────── */
document.body.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (btn && !btn.closest('#vol-slider') && !btn.closest('#bright-slider')) {
    const action = btn.dataset.action;
    // Optimistically flip play/pause icon on tap — server will confirm on next poll
    if (action === 'playPause') {
      const use = $('play-ico').querySelector('use');
      const isPlay = use.getAttribute('href') === '#i-play';
      use.setAttribute('href', isPlay ? '#i-pause' : '#i-play');
    }
    send(action);
  }
});


/* ── Fullscreen ───────────────────────────────────────────────────────────── */
const $fsBtn = $('fs-btn');
function toggleFs() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    $fsBtn.querySelector('use').setAttribute('href', '#i-minimize');
  } else {
    document.exitFullscreen().catch(() => {});
    $fsBtn.querySelector('use').setAttribute('href', '#i-maximize');
  }
}
$fsBtn.addEventListener('click', toggleFs);
let autoFsDone = false;
document.body.addEventListener('touchstart', () => {
  if (!autoFsDone && !document.fullscreenElement &&
      !matchMedia('(display-mode: fullscreen)').matches &&
      !matchMedia('(display-mode: standalone)').matches) {
    autoFsDone = true;
    document.documentElement.requestFullscreen().catch(() => {});
  }
}, { once: true });

/* ── PWA install ──────────────────────────────────────────────────────────── */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  $('install-banner').classList.add('show');
});
$('install-btn').addEventListener('click', () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; $('install-banner').classList.remove('show'); });
  }
});
$('install-dismiss').addEventListener('click', () => $('install-banner').classList.remove('show'));

/* ── WoL sheet ────────────────────────────────────────────────────────────── */
$('wol-btn').addEventListener('click', () => {
  $('wol-cmd').textContent = `wakeonlan ${wolMac}`;
  $('wol-copied').classList.remove('show');
  $('wol-sheet').classList.add('show');
  vibrate(28);
});
$('wol-backdrop').addEventListener('click', () => $('wol-sheet').classList.remove('show'));
$('wol-copy-btn').addEventListener('click', () => {
  navigator.clipboard.writeText(`wakeonlan ${wolMac}`)
    .then(() => { $('wol-copied').classList.add('show'); vibrate(40); })
    .catch(() => showToast('Select the text and copy manually'));
});
$('wol-termux-btn').addEventListener('click', () => {
  navigator.clipboard.writeText(`wakeonlan ${wolMac}`).catch(() => {});
  window.location.href = 'termux://open';
  setTimeout(() => showToast('Command copied — paste in Termux'), 300);
  $('wol-sheet').classList.remove('show');
});

/* ── Toast ────────────────────────────────────────────────────────────────── */
const $toast = $('toast');
let toastTimer;
function showToast(msg) {
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('show'), 2400);
}

/* ── Screen dimmer ────────────────────────────────────────────────────────── */
const $dimOverlay = $('dim-overlay');
const $dimSlider  = $('dim-slider');
const $dimVal     = $('dim-val');

const savedDim = parseInt(localStorage.getItem('mac-deck-dim') || '0', 10);
setDim(savedDim);

function setDim(val) {
  val = Math.max(0, Math.min(90, val));
  $dimSlider.value = val;
  paintSlider($dimSlider, val / 90 * 100, 'rgba(255,255,255,0.3)');
  $dimOverlay.style.opacity = (val / 100).toFixed(2);
  $dimVal.textContent = val === 0 ? 'Off' : `${val}%`;
  localStorage.setItem('mac-deck-dim', val);
}

$dimSlider.addEventListener('input',    () => setDim(+$dimSlider.value));
$('dim-down').addEventListener('click', () => setDim(+$dimSlider.value - 10));
$('dim-up').addEventListener('click',   () => setDim(+$dimSlider.value + 10));

/* ── Haptic ───────────────────────────────────────────────────────────────── */
function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

/* ── Pinned Dock ──────────────────────────────────────────────────────────── */
let dock = JSON.parse(localStorage.getItem('mac-deck-dock') || '[]');
let dockEditing = false;

function saveDock() {
  localStorage.setItem('mac-deck-dock', JSON.stringify(dock));
}

function renderDock() {
  const grid = $('dock-grid');
  grid.innerHTML = '';

  dock.forEach((app, idx) => {
    const cell = document.createElement('div');
    cell.className = 'app-cell dock-cell';

    // remove badge (visible in edit mode)
    const badge = document.createElement('div');
    badge.className = 'dock-remove-badge';
    badge.textContent = '−';
    badge.addEventListener('click', e => {
      e.stopPropagation();
      dock.splice(idx, 1);
      saveDock();
      renderDock();
      vibrate(30);
    });

    const iconWrap = document.createElement('div');
    iconWrap.className = 'app-cell-icon';
    const img = document.createElement('img');
    img.alt = app.name;
    img.src = `/api/icon/${encodeURIComponent(app.iconName || app.name)}`;
    img.onerror = () => {
      img.remove();
      const init = document.createElement('span');
      init.className = 'app-initial';
      init.textContent = app.name[0];
      iconWrap.appendChild(init);
    };
    iconWrap.appendChild(img);

    const label = document.createElement('div');
    label.className = 'app-cell-name';
    label.textContent = app.name;

    cell.appendChild(badge);
    cell.appendChild(iconWrap);
    cell.appendChild(label);

    cell.addEventListener('click', () => {
      if (dockEditing) return;
      cell.classList.add('switching');
      send('launchApp', { appName: app.appName || app.name, appPath: app.appPath });
      setTimeout(() => cell.classList.remove('switching'), 500);
      vibrate(22);
    });

    grid.appendChild(cell);
  });

  // + add button (always last)
  const addCell = document.createElement('div');
  addCell.className = 'dock-add-cell';
  addCell.innerHTML = `
    <div class="dock-add-icon">
      <svg class="ico" width="26" height="26"><use href="#i-plus"/></svg>
    </div>
    <div class="dock-add-label">Add App</div>`;
  addCell.addEventListener('click', openPicker);
  grid.appendChild(addCell);

  // toggle wiggle
  if (dockEditing) grid.classList.add('editing');
  else grid.classList.remove('editing');
}

// Edit toggle
$('dock-edit-btn').addEventListener('click', () => {
  dockEditing = !dockEditing;
  $('dock-edit-btn').textContent = dockEditing ? 'Done' : 'Edit';
  renderDock();
  vibrate(20);
});

/* ── App picker ───────────────────────────────────────────────────────────── */
let allInstalledApps = [];   // loaded once from /api/all-apps

async function loadAllApps() {
  if (allInstalledApps.length) return;
  try {
    const r = await fetch('/api/all-apps');
    const j = await r.json();
    allInstalledApps = j.apps || [];
  } catch {}
}

async function openPicker() {
  dockEditing = false;
  $('dock-edit-btn').textContent = 'Edit';
  renderDock();
  $('picker-search').value = '';
  $('picker-list').innerHTML = `<div style="text-align:center;color:var(--text3);padding:40px 0;font-size:14px">Loading…</div>`;
  $('picker-sheet').classList.add('show');
  vibrate(20);
  await loadAllApps();
  buildPickerList('');
  setTimeout(() => $('picker-search').focus(), 120);
}

function closePicker() {
  $('picker-sheet').classList.remove('show');
  $('picker-search').blur();
  $('picker-panel').style.maxHeight = '';
}

function buildPickerList(query) {
  const list = $('picker-list');
  list.innerHTML = '';
  const q = query.toLowerCase().trim();

  // Merge installed + running, deduplicate by name
  const runningNames = new Set(runningApps.map(a => a.appName || a.name));
  const merged = [...allInstalledApps];
  runningApps.forEach(a => {
    if (!a.chromeWindowIndex && !merged.find(m => m.name === (a.appName || a.name))) {
      merged.push({ name: a.appName || a.name, appPath: a.appPath, appName: a.appName || a.name });
    }
  });

  const filtered = merged.filter(a => !q || a.name.toLowerCase().includes(q));

  if (!filtered.length) {
    list.innerHTML = `<div style="text-align:center;color:var(--text3);padding:40px 0;font-size:14px">No apps found</div>`;
    return;
  }

  const frag = document.createDocumentFragment();
  filtered.forEach(app => {
    const alreadyPinned = !!dock.find(d => d.name === app.name);
    const isRunning     = runningNames.has(app.name);

    const item = document.createElement('div');
    item.className = 'picker-item' + (alreadyPinned ? ' already-pinned' : '');

    const iconWrap = document.createElement('div');
    iconWrap.className = 'picker-item-icon';
    const img = document.createElement('img');
    img.alt = app.name;
    img.src = `/api/icon/${encodeURIComponent(app.name)}`;
    img.onerror = () => {
      img.remove();
      const init = document.createElement('span');
      init.className = 'app-initial';
      init.textContent = app.name[0];
      iconWrap.appendChild(init);
    };
    iconWrap.appendChild(img);

    const nameWrap = document.createElement('div');
    nameWrap.style.cssText = 'display:flex;flex-direction:column;gap:2px';
    const nameLine = document.createElement('div');
    nameLine.className = 'picker-item-name';
    nameLine.textContent = app.name;
    nameWrap.appendChild(nameLine);
    if (isRunning) {
      const badge = document.createElement('div');
      badge.style.cssText = 'font-size:11px;color:var(--green);font-weight:500';
      badge.textContent = 'Running';
      nameWrap.appendChild(badge);
    }
    if (alreadyPinned) {
      const badge = document.createElement('div');
      badge.style.cssText = 'font-size:11px;color:var(--text3)';
      badge.textContent = 'Already in dock';
      nameWrap.appendChild(badge);
    }

    item.appendChild(iconWrap);
    item.appendChild(nameWrap);

    if (!alreadyPinned) {
      item.addEventListener('click', () => {
        dock.push({ name: app.name, appName: app.name, appPath: app.appPath || '', iconName: app.name });
        saveDock();
        renderDock();
        closePicker();
        vibrate(40);
      });
    }

    frag.appendChild(item);
  });
  list.appendChild(frag);
}

$('picker-backdrop').addEventListener('click', closePicker);
$('picker-search').addEventListener('input', e => buildPickerList(e.target.value));

// ── Shrink panel height to fit above keyboard (keeps search bar visible) ───
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const sheet = $('picker-sheet');
    if (!sheet.classList.contains('show')) return;
    const available = window.visualViewport.height;
    $('picker-panel').style.maxHeight = `${Math.round(available * 0.92)}px`;
  });
}

// Initial render
renderDock();

/* ── Service Worker ───────────────────────────────────────────────────────── */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

/* ── Boot ─────────────────────────────────────────────────────────────────── */
connect();
</script>
</body>
</html>
